<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="CSS/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayside Restaraunt</title>
</head>
<body id="signup-body">
    <form action="" method="post" id="sign-up-form">
        <div class="form-container">
            <h1>Welcome to Bayside.</h1>
            <label>Full Name: </label>
            <input type="text" id="full-name" placeholder="Enter your name..." required>
            <br>
            <label>Email: </label>
            <input type="email" id="user-email" placeholder="Enter your email..." required>
            <br><br>
            <button type="submit" id="submit-button">Enter Shopping Page</button>
        </div>
    </form>

    <script src="JS/sign-up.js"></script>
</body>
</html>
