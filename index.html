<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="CSS/sign-up.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bayside Restaraunt</title>
</head>
<body id="signup-body">
    <img src="https://i.pinimg.com/736x/fe/fa/52/fefa526b30187e2c4097f9092a27a988.jpg" id="restaraunt-image" height="400px" width="400px">
    <form action="" method="post" id="sign-up-form">
        <div class="form-container">
            <h2 class="welcome-text">Welcome to</h2>
            <h1 class="restaurant-title">BAYSIDE.</h1>
            <p class="description">
            Enjoy delicious food, refreshing ocean breezes,
            and beautiful moments by the sea.
            </p>
            <label>Full Name: </label>
            <input type="text" id="full-name" placeholder="Enter your name..." required>
            <br>
            <label>Email: </label>
            <input type="email" id="user-email" placeholder="Enter your email..." required>
            <br><br>
            <button type="submit" id="submit-button">Make your order list</button>
        </div>
    </form>

    <script src="JS/sign-up.js"></script>
</body>
</html>
