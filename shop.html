<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="CSS/styles.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body id="shop-body">
    <div class="container">
      <nav class="navbar">

        <ul class="nav-links">

          <li

                  padding: 0.2rem;

                  padding-inline: 0.5rem;

                id="item-amount"
              >
                0

            >
          </li>
        </ul>
        <div style="justify-self: flex-end">

        <script src="JS/shop.js"></script>
